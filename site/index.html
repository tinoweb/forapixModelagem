<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ForaPix - Jogos e Apostas</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a1a2e',
                        secondary: '#16213e',
                        accent: '#7c3aed',
                        'accent-light': '#8b5cf6',
                        dark: '#0f0f1a',
                        'card-bg': '#1e1e3f',
                        'card-hover': '#2a2a4a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white min-h-screen">
    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col">
        <!-- Header -->
        <header id="header" class="bg-primary px-4 py-3 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <img src="assets/images/logo.png" alt="ForaPix" class="h-8" onerror="this.outerHTML='<span class=\'text-xl font-bold text-accent\'>⚡ FORAPIX</span>'">
            </div>
            <div class="flex items-center gap-3">
                <button id="themeToggle" class="w-10 h-5 bg-gray-600 rounded-full relative">
                    <span class="absolute left-1 top-1 w-3 h-3 bg-green-400 rounded-full transition-all"></span>
                </button>
                <button class="text-gray-400 hover:text-white">
                    <i class="fas fa-eye"></i>
                </button>
                <div id="balanceDisplay" class="bg-secondary px-3 py-1 rounded-lg text-sm font-semibold cursor-pointer hover:bg-card-hover transition">
                    R$ <span id="userBalance">0,00</span>
                </div>
                <button id="profileBtn" class="w-8 h-8 bg-accent rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-sm"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto pb-20">
            <!-- Pages will be loaded here -->
        </main>

        <!-- Bottom Navigation -->
        <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-secondary border-t border-gray-700 px-2 py-2 z-50">
            <div class="flex justify-around items-center">
                <button class="nav-item active" data-page="home">
                    <i class="fas fa-home text-lg"></i>
                    <span class="text-xs mt-1">Início</span>
                </button>
                <button class="nav-item" data-page="games">
                    <i class="fas fa-gamepad text-lg"></i>
                    <span class="text-xs mt-1">Jogos</span>
                </button>
                <button class="nav-item deposit-btn" data-page="deposit">
                    <div class="bg-accent w-12 h-12 rounded-full flex items-center justify-center -mt-6 shadow-lg">
                        <i class="fas fa-plus text-xl"></i>
                    </div>
                    <span class="text-xs mt-1">Depositar</span>
                </button>
                <button class="nav-item" data-page="wallet">
                    <i class="fas fa-wallet text-lg"></i>
                    <span class="text-xs mt-1">Carteira</span>
                </button>
                <button class="nav-item" data-page="menu">
                    <i class="fas fa-bars text-lg"></i>
                    <span class="text-xs mt-1">Menu</span>
                </button>
            </div>
        </nav>

        <!-- Modal Container -->
        <div id="modalContainer" class="fixed inset-0 z-[100] hidden">
            <div class="modal-backdrop absolute inset-0 bg-black/70" onclick="closeModal()"></div>
            <div id="modalContent" class="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-card-bg rounded-t-3xl p-6 transform transition-transform">
                <!-- Modal content will be injected here -->
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="fixed top-20 left-4 right-4 max-w-md mx-auto z-[110] space-y-2"></div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="fixed inset-0 bg-dark/90 z-[120] hidden items-center justify-center">
            <div class="text-center">
                <div class="w-12 h-12 border-4 border-accent border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="mt-4 text-gray-400">Carregando...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/pages/home.js"></script>
    <script src="assets/js/pages/games.js"></script>
    <script src="assets/js/pages/matches.js"></script>
    <script src="assets/js/pages/bet.js"></script>
    <script src="assets/js/pages/sinuca.js"></script>
    <script src="assets/js/pages/deposit.js"></script>
    <script src="assets/js/pages/wallet.js"></script>
    <script src="assets/js/pages/menu.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
