<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Imagens - ApostaCasada</title>
    <style>
        body { 
            background: #0f0f1a; 
            color: white; 
            font-family: Arial, sans-serif; 
            padding: 20px;
        }
        .image-container {
            margin: 20px 0;
            border: 2px solid #7c3aed;
            border-radius: 12px;
            padding: 10px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        h3 {
            color: #7c3aed;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🎮 Teste de Imagens ApostaCasada</h1>
    
    <div class="image-container">
        <h3>Aposta Casada</h3>
        <img src="assets/images/apostacasada.png" alt="Aposta Casada">
    </div>
    
    <div class="image-container">
        <h3>Cassino</h3>
        <img src="assets/images/casino.png" alt="Cassino">
    </div>
    
    <div class="image-container">
        <h3>Bingo</h3>
        <img src="assets/images/bingo.png" alt="Bingo">
    </div>
    
    <p><a href="index.html" style="color: #7c3aed;">← Voltar para o App</a></p>
</body>
</html>
