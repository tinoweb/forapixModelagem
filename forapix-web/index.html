<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JRpix - Jogos e Apostas Online</title>
    <link rel="icon" type="image/png" href="assets/images/jrpix.png">
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css?v=1781736442669">
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f1a16',
                        secondary: '#162620',
                        accent: '#10b981',
                        'accent-light': '#34d399',
                        dark: '#0a0f0d',
                        'card-bg': '#1b2a24',
                        'card-hover': '#263b32',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        gold: '#f59e0b',
                        'gold-light': '#fbbf24'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-white min-h-screen">
    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative">
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-card-bg p-6 rounded-2xl flex flex-col items-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-accent mb-4"></div>
                <p class="text-sm text-gray-400">Carregando...</p>
            </div>
        </div>

        <!-- Header -->
        <header id="header" class="app-header px-4 py-3 flex items-center justify-between sticky top-0 z-40">
            <div id="headerBrand" class="flex items-center gap-2">
                <img src="assets/images/loGOJRpix.png" alt="JRpix" class="h-8">
            </div>
            <div class="flex items-center gap-3">
                <!-- Autenticado -->
                <div id="headerAuth" class="flex items-center gap-3 hidden">
                    <!-- Balance Display -->
                    <div id="balanceDisplay" class="balance-pill cursor-pointer">
                        R$ <span id="userBalance">0,00</span>
                    </div>
                    <!-- Profile Button -->
                    <button id="profileBtn" class="profile-btn" aria-label="Perfil">
                        <i class="fas fa-user text-sm"></i>
                    </button>
                </div>

                <!-- Não autenticado -->
                <div id="headerGuest" class="flex items-center gap-2">
                    <button onclick="App.navigateTo('menu')" class="btn btn-primary btn-sm" style="padding:6px 14px;font-size:13px;">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 overflow-y-auto">
            <!-- Content will be loaded here -->
        </main>

        <!-- Bottom Navigation -->
        <nav id="bottomNav" class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <span class="nav-icon"><i class="fas fa-home"></i></span>
                <span class="nav-label">Início</span>
            </button>
            <button class="nav-item" data-page="games">
                <span class="nav-icon"><i class="fas fa-gamepad"></i></span>
                <span class="nav-label">Jogos</span>
            </button>
            <button class="nav-item deposit-btn" data-page="deposit">
                <span class="deposit-fab"><i class="fas fa-coins"></i></span>
                <span class="nav-label">Depositar</span>
            </button>
            <button class="nav-item" data-page="wallet">
                <span class="nav-icon"><i class="fas fa-wallet"></i></span>
                <span class="nav-label">Carteira</span>
            </button>
            <button class="nav-item" data-page="menu">
                <span class="nav-icon"><i class="fas fa-bars"></i></span>
                <span class="nav-label">Menu</span>
            </button>
        </nav>

        <!-- Modals Container -->
        <div id="modalsContainer"></div>

        <!-- Toast Container -->
        <div id="toastContainer" class="fixed top-20 left-4 right-4 z-50 space-y-2"></div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
    <script src="assets/js/.js?v=1781736442671"></script>
</body>
</html>
